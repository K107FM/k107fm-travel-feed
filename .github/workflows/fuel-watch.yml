name: Fuel Watch

on:
  workflow_dispatch:

jobs:
  auth-test:
    runs-on: ubuntu-latest

    steps:
      - name: Install requests
        run: pip install requests

      - name: Get Fuel Finder Token
        env:
          FUEL_CLIENT_ID: ${{ secrets.FUEL_CLIENT_ID }}
          FUEL_CLIENT_SECRET: ${{ secrets.FUEL_CLIENT_SECRET }}
        run: |
          python << 'EOF'
          import os

          print("Client ID exists:", bool(os.environ.get("FUEL_CLIENT_ID")))
          print("Client Secret exists:", bool(os.environ.get("FUEL_CLIENT_SECRET")))
          print("Client ID length:", len(os.environ.get("FUEL_CLIENT_ID", "")))
          print("Client Secret length:", len(os.environ.get("FUEL_CLIENT_SECRET", "")))

          EOF
